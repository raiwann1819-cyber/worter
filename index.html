<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>バブルポップ</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to top, #a0eaff, #ffffff);
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 48px;
      color: #0077cc;
      animation: float 2s ease-in-out infinite;
    }
    .overlay button {
      font-size: 20px;
      padding: 8px 20px;
      margin: 6px;
      border: none;
      background: #3399ff;
      color: white;
      border-radius: 8px;
    }
    .overlay select {
      font-size: 18px;
      margin: 10px;
      padding: 5px;
    }
    .overlay p {
      font-size: 16px;
      color: #004466;
      margin-top: 20px;
      text-align: center;
    }
    #scoreBoard, #timer, #highScore {
      position: absolute;
      font-size: 20px;
      color: #004466;
    }
    #scoreBoard { top: 10px; left: 20px; }
    #timer { top: 10px; right: 20px; }
    #highScore { top: 40px; right: 20px; }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="titleScreen" class="overlay">
  <h1>🫧全部のせバブルポップ🫧</h1>
  <label>難易度：
    <select id="difficulty">
      <option value="easy">かんたん</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">むずかしい</option>
    </select>
  </label>
  <label>時間：
    <select id="timeLimit">
      <option value="30" selected>30秒</option>
      <option value="60">60秒</option>
    </select>
  </label>
  <button onclick="startGame()">スタート！</button>
  <p>📱 タップ or 💻 クリックでバブルを割ろう！<br>タフバブルは5回タップで割れるよ！</p>
</div>

<div id="gameOverScreen" class="overlay" style="display:none;">
  <h1>タイムアップ！</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">リトライ</button>
</div>

<div id="scoreBoard">スコア: 0</div>
<div id="timer">のこり: 30</div>
<div id="highScore">ハイスコア: 0</div>
<audio id="popSound" src="https://freesound.org/data/previews/341/341695_5260877-lq.mp3"></audio>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const bubbles = [];
  let score = 0;
  let timeLeft = 30;
  let gameRunning = false;
  let timerInterval, bubbleInterval;
  let bubbleSpeed = 2;
  let bubbleRate = 600;

  const titleScreen = document.getElementById("titleScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const finalScoreText = document.getElementById("finalScore");
  const scoreBoard = document.getElementById("scoreBoard");
  const timerDisplay = document.getElementById("timer");
  const highScoreDisplay = document.getElementById("highScore");
  const popSound = document.getElementById("popSound");

  const difficultySelect = document.getElementById("difficulty");
  const timeLimitSelect = document.getElementById("timeLimit");

  let highScore = localStorage.getItem("bubbleHighScore") || 0;
  highScoreDisplay.textContent = "ハイスコア: " + highScore;

  function createBubble() {
    if (!gameRunning) return;
    const isTough = Math.random() < 0.2;
    bubbles.push({
      x: Math.random() * canvas.width,
      y: canvas.height + 30,
      radius: isTough ? 35 : 20 + Math.random() * 20,
      speed: bubbleSpeed + Math.random() * 1.5,
      hits: isTough ? 5 : 1,
      maxHits: isTough ? 5 : 1
    });
  }

  function drawBubble(bubble) {
    const alpha = 0.3 + 0.7 * (bubble.hits / bubble.maxHits);
    ctx.beginPath();
    ctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
    ctx.fillStyle = bubble.maxHits > 1 ? `rgba(0, 150, 255, ${alpha})` : "rgba(255, 255, 255, 0.5)";
    ctx.strokeStyle = bubble.maxHits > 1 ? "#004488" : "#99ccff";
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
    ctx.closePath();
  }

  function update() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach((bubble, index) => {
      bubble.y -= bubble.speed;
      drawBubble(bubble);
      if (bubble.y + bubble.radius < 0) {
        bubbles.splice(index, 1);
      }
    });
    requestAnimationFrame(update);
  }

  function handlePop(x, y) {
    bubbles.forEach((bubble, index) => {
      const dx = bubble.x - x;
      const dy = bubble.y - y;
      if (Math.sqrt(dx * dx + dy * dy) < bubble.radius) {
        bubble.hits--;
        popSound.currentTime = 0;
        popSound.play();
        if (bubble.hits <= 0) {
          bubbles.splice(index, 1);
          score++;
          scoreBoard.textContent = "スコア: " + score;
        }
      }
    });
  }

  canvas.addEventListener("touchstart", (e) => {
    if (!gameRunning) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    handlePop(touch.clientX - rect.left, touch.clientY - rect.top);
  });

  canvas.addEventListener("mousedown", (e) => {
    if (!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    handlePop(e.clientX - rect.left, e.clientY - rect.top);
  });

  function countdown() {
    timeLeft--;
    timerDisplay.textContent = "のこり: " + timeLeft;
    if (timeLeft <= 0) {
      endGame();
    }
  }

  function startGame() {
    const difficulty = difficultySelect.value;
    if (difficulty === "easy") {
      bubbleSpeed = 1;
      bubbleRate = 900;
    } else if (difficulty === "normal") {
      bubbleSpeed = 2;
      bubbleRate = 600;
    } else if (difficulty === "hard") {
      bubbleSpeed = 3;
      bubbleRate = 400;
    }

    timeLeft = parseInt(timeLimitSelect.value);

    titleScreen.style.display = "none";
    gameOverScreen.style.display = "none";
    score = 0;
    bubbles.length = 0;
    gameRunning = true;
    scoreBoard.textContent = "スコア: 0";
    timerDisplay.textContent = "のこり: " + timeLeft;
    update();
    bubbleInterval = setInterval(createBubble, bubbleRate);
    timerInterval = setInterval(countdown, 1000);
  }

  function endGame() {
    gameRunning = false;
    clearInterval(bubbleInterval);
    clearInterval(timerInterval);
    finalScoreText.textContent = "あなたのスコア: " + score;
    if (score > highScore) {
      localStorage.setItem("bubbleHighScore",
