<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>バブルポップゲーム</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #e0f7fa;
    }
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #81d4fa, #0288d1);
      cursor: pointer;
    }
    #scoreBoard {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: #01579b;
    }
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      padding: 10px 20px;
      background-color: #4fc3f7;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #gameOverScreen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #timer {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      color: #01579b;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div id="scoreBoard">スコア: 0</div>
    <div id="timer">30</div>
    <button id="startButton" onclick="startGame()">スタート</button>
    <div id="gameOverScreen">
      <div id="finalScore"></div>
      <div id="highScoreDisplay"></div>
      <button onclick="startGame()">もう一度！</button>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById("gameArea");
    const scoreBoard = document.getElementById("scoreBoard");
    const timerDisplay = document.getElementById("timer");
    const startButton = document.getElementById("startButton");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScoreText = document.getElementById("finalScore");
    const highScoreDisplay = document.getElementById("highScoreDisplay");

    let score = 0;
    let highScore = localStorage.getItem("bubbleHighScore") || 0;
    let gameRunning = false;
    let bubbleInterval;
    let timerInterval;
    let timeLeft = 30;

    function startGame() {
      score = 0;
      timeLeft = 30;
      scoreBoard.textContent = "スコア: 0";
      timerDisplay.textContent = timeLeft;
      gameOverScreen.style.display = "none";
      startButton.style.display = "none";
      gameRunning = true;

      bubbleInterval = setInterval(createBubble, 800);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(bubbleInterval);
      clearInterval(timerInterval);
      finalScoreText.textContent = "あなたのスコア: " + score;
      if (score > highScore) {
        localStorage.setItem("bubbleHighScore", score);
        highScore = score;
        highScoreDisplay.textContent = "ハイスコア: " + highScore;
      } else {
        highScoreDisplay.textContent = "ハイスコア: " + highScore;
      }
      gameOverScreen.style.display = "flex";
    }

    function createBubble() {
      if (!gameRunning) return;
      const bubble = document.createElement("div");
      const size = Math.random() * 50 + 30;
      bubble.classList.add("bubble");
      bubble.style.width = size + "px";
      bubble.style.height = size + "px";
      bubble.style.left = Math.random() * (window.innerWidth - size) + "px";
      bubble.style.top = Math.random() * (window.innerHeight - size) + "px";

      bubble.addEventListener("click", () => {
        if (!gameRunning) return;
        score++;
        scoreBoard.textContent = "スコア: " + score;
        bubble.remove();
      });

      gameArea.appendChild(bubble);

      setTimeout(() => {
        if (bubble.parentElement) {
          bubble.remove();
        }
      }, 2000);
    }
  </script>
</body>
</html>
