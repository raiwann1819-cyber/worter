<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>バブルポップ</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to top, #a0eaff, #ffffff);
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 48px;
      color: #0077cc;
      animation: float 2s ease-in-out infinite;
    }
    .overlay button {
      font-size: 20px;
      padding: 8px 20px;
      margin: 6px;
      border: none;
      background: #3399ff;
      color: white;
      border-radius: 8px;
    }
    .overlay select {
      font-size: 18px;
      margin: 10px;
      padding: 5px;
    }
    .overlay p {
      font-size: 16px;
      color: #004466;
      margin-top: 20px;
      text-align: center;
    }
    #scoreBoard, #timer, #highScore {
      position: absolute;
      font-size: 20px;
      color: #004466;
    }
    #scoreBoard { top: 10px; left: 20px; }
    #timer { top: 10px; right: 20px; }
    #highScore { top: 40px; right: 20px; }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<canvas id="gameCanvas"></canvas>

<div id="titleScreen" class="overlay">
  <h1>🫧バブルポップ🫧</h1>
  <label>難易度：
    <select id="difficulty">
      <option value="easy">かんたん</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">むずかしい</option>
    </select>
  </label>
  <label>時間：
    <select id="timeLimit">
      <option value="30" selected>30秒</option>
      <option value="60">60秒</option>
    </select>
  </label>
  <button onclick="startGame()">スタート！</button>
  <p>📱 タップ or 💻 クリックでバブルを割ろう！<br>タフバブルは5回タップで割れるよ！</p>
</div>

<div id="gameOverScreen" class="overlay" style="display:none;">
